version: '3.8'

services:
  # VLLM Server - Runs the model efficiently on GPU 1
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: olmocr-vllm-server
    runtime: nvidia
    command: >
      --model allenai/olmOCR-2-7B-1025-FP8
      --port 8000
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --trust-remote-code
    ports:
      - "8010:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=1
      - NVIDIA_VISIBLE_DEVICES=1
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - vllm_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - olmocr-network

  # FastAPI Wrapper - Your API on port 5006
  olmocr-api:
    image: alexxyk/olmocr-api:vllm
    container_name: olmocr-api
    ports:
      - "5006:5005"
    environment:
      - PORT=5005
      - VLLM_BASE_URL=http://vllm-server:8000/v1
      - MODEL_NAME=allenai/olmOCR-2-7B-1025-FP8
      - TARGET_IMAGE_DIM=1024
    depends_on:
      - vllm-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - olmocr-network

volumes:
  vllm_cache:
    driver: local

networks:
  olmocr-network:
    driver: bridge

