version: '3.8'

services:
  olmocr-api:
    image: alexxyk/olmocr-api:smart
    container_name: olmocr-api
    ports:
      - "5006:5005"
    environment:
      # API Configuration
      - PORT=5005
      
      # Model Configuration (FP8 optimized with reduced image size)
      - MODEL_NAME=allenai/olmOCR-2-7B-1025-FP8
      - PROCESSOR_NAME=Qwen/Qwen2.5-VL-7B-Instruct
      - TARGET_IMAGE_DIM=640
      
      # Smart Memory Management
      - KEEP_ALIVE_SECONDS=300
      
      # GPU Configuration - MUST use GPU 1
      - NVIDIA_VISIBLE_DEVICES=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  huggingface_cache:
    driver: local

